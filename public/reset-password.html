<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Redirecting…</title>
    <script>
      (function(){
        try {
          // Remove the filename from the path to get the site root (works for GitHub Pages under a repository path)
          var pathname = window.location.pathname || '/';
          var base = pathname.replace(/\/?reset-password\.html$/, '/');
          var search = window.location.search || '';
          var target = window.location.origin + base + '#/reset-password' + search;
          window.location.replace(target);
        } catch (e) {
          // fallback to root
          window.location.replace(window.location.origin + '/#/reset-password' + (window.location.search || ''));
        }
      })();
    </script>
  </head>
  <body>
    Redirecting to reset page…
  </body>
</html>
